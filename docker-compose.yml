# Phase 2 database: Postgres 16 with the pgvector extension.
#   docker compose up -d
#   python -m phase2.setup_db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres   # dev only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15
